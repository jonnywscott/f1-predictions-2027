<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>F1 Predictions 2027</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #151515;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px 24px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 3px 15px rgba(0,0,0,.07);
    }

    #app {
      display: none;
    }

    #login {
      max-width: 500px;
      margin: 80px auto;
      text-align: center;
    }

    .flag {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
    }

    h2 {
      margin-top: 30px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    .message {
      padding: 14px 16px;
      border-radius: 9px;
      margin: 20px 0;
      background: #f1f1f1;
    }

    .error {
      background: #ffe4e4;
      color: #9b0000;
    }

    .success {
      background: #e5f7e8;
      color: #176b25;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .player {
      font-size: 16px;
    }

    select {
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    .race-selector {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .driver-row {
      display: grid;
      grid-template-columns: 1fr 130px 130px;
      gap: 15px;
      align-items: center;
      padding: 12px 5px;
      border-bottom: 1px solid #eee;
    }

    .driver-name {
      font-weight: 600;
    }

    .team {
      display: block;
      color: #777;
      font-size: 13px;
      margin-top: 3px;
    }

    .position-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
      display: block;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    .save-container {
      margin-top: 25px;
    }

    .prediction-list {
      padding-left: 25px;
    }

    .prediction-list li {
      margin: 7px 0;
    }

    .private-notice {
      background: #fff6d8;
      border-left: 4px solid #d9a900;
    }

    .public-notice {
      background: #e5f7e8;
      border-left: 4px solid #2d8a3d;
    }

    @media (max-width: 650px) {

      .driver-row {
        grid-template-columns: 1fr 90px 90px;
        gap: 8px;
      }

      .card {
        padding: 20px;
      }

      .container {
        margin-top: 15px;
      }

    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">🏁 F1 Predictions 2027</div>
  </div>
</header>


<div class="container">

  <!-- LOGIN -->

  <div class="card" id="login">

    <div class="flag">🏎️</div>

    <h1>F1 Predictions 2027</h1>

    <div class="subtitle">
      Make your predictions. Beat your mates.
    </div>

    <div id="googleButton"></div>

    <div id="loginMessage"></div>

  </div>


  <!-- APP -->

  <div class="card" id="app">

    <div class="topbar">

      <div class="player">
        Welcome back,
        <strong id="playerName"></strong>
      </div>

      <div class="race-selector">

        <label for="raceSelect">
          <strong>Race:</strong>
        </label>

        <select id="raceSelect"></select>

      </div>

    </div>

    <div id="raceInfo"></div>

    <div id="predictionArea"></div>

    <div id="appMessage"></div>

  </div>

</div>


<script>

const CLIENT_ID =
  '618343895277-klbvf987p9vqvr8tf72si0ht79v1cpj8.apps.googleusercontent.com';

const API_URL =
  'https://script.google.com/macros/s/AKfycbxioW-0oLb8U-yGFvV5iVNYVClr7W5NJl0ofQ-NoXdOxxQdgUAs4_w4Ei_0rbCuN70IfA/exec';

let session = null;
let currentPlayer = null;
let races = [];
let drivers = [];


/* =========================================================
   INITIALISE GOOGLE SIGN-IN
   ========================================================= */

window.onload = function() {

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleGoogleCredential
  });

  google.accounts.id.renderButton(
    document.getElementById('googleButton'),
    {
      theme: 'outline',
      size: 'large',
      text: 'continue_with',
      shape: 'rectangular',
      width: 280
    }
  );

};


/* =========================================================
   GOOGLE LOGIN
   ========================================================= */

function handleGoogleCredential(response) {

  showLoginMessage('Signing you in...');

  apiCall(
    'login',
    {
      credential: response.credential
    },
    function(result) {

      if (!result.success) {

        showLoginMessage(
          result.error || 'Unable to sign you in.',
          true
        );

        return;
      }

      session = result.session;
      currentPlayer = result.player;

      localStorage.setItem(
        'f1_session',
        session
      );

      enterApp();

    }
  );

}


/* =========================================================
   ENTER APP
   ========================================================= */

function enterApp() {

  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  document.getElementById('playerName').textContent =
    currentPlayer.name;

  loadRaces();

}


/* =========================================================
   LOAD RACES
   ========================================================= */

function loadRaces() {

  apiCall(
    'races',
    {},
    function(result) {

      if (!result.success) {
        showAppMessage(result.error, true);
        return;
      }

      races = result.races;

      const select =
        document.getElementById('raceSelect');

      select.innerHTML = '';

      races.forEach(function(race) {

        const option =
          document.createElement('option');

        option.value = race.raceId;
        option.textContent = race.race;

        select.appendChild(option);

      });

      select.onchange = loadRace;

      loadDrivers();

    }
  );

}


/* =========================================================
   LOAD DRIVERS
   ========================================================= */

function loadDrivers() {

  apiCall(
    'drivers',
    {},
    function(result) {

      if (!result.success) {
        showAppMessage(result.error, true);
        return;
      }

      drivers = result.drivers;

      loadRace();

    }
  );

}


/* =========================================================
   LOAD SELECTED RACE
   ========================================================= */

function loadRace() {

  const raceId =
    document.getElementById('raceSelect').value;

  if (!raceId) return;

  const race =
    races.find(
      r => r.raceId === raceId
    );

  if (race) {

    let info = '';

    if (race.qualifyingStart) {

      const date =
        new Date(race.qualifyingStart);

      info +=
        '<div class="message">' +
        '<strong>Qualifying:</strong> ' +
        date.toLocaleString() +
        '</div>';

    }

    document.getElementById('raceInfo').innerHTML =
      info;

  }

  apiCall(
    'predictions',
    {
      raceId: raceId
    },
    function(result) {

      if (!result.success) {
        showAppMessage(result.error, true);
        return;
      }

      renderPredictions(result);

    }
  );

}


/* =========================================================
   RENDER PREDICTIONS
   ========================================================= */

function renderPredictions(result) {

  const area =
    document.getElementById('predictionArea');

  let html = '';

  if (!result.qualifyingStarted) {

    html +=
      '<div class="message private-notice">' +
      '<strong>🔒 Predictions are private</strong><br>' +
      'Other players cannot see your predictions until qualifying starts.' +
      '</div>';

  } else {

    html +=
      '<div class="message public-notice">' +
      '<strong>🔓 Predictions are now visible</strong><br>' +
      'All players can see each other’s predictions.' +
      '</div>';

  }


  const grouped = {};

  result.predictions.forEach(function(prediction) {

    if (!grouped[prediction.playerId]) {

      grouped[prediction.playerId] = {
        name: prediction.playerName,
        predictions: []
      };

    }

    grouped[prediction.playerId]
      .predictions
      .push(prediction);

  });


  const mine =
    grouped[currentPlayer.playerId];

  html += '<h2>Your Predictions</h2>';

  html += renderPredictionEditor(
    mine ? mine.predictions : [],
    result.qualifyingStarted
  );


  const others =
    Object.keys(grouped)
      .filter(
        id => id !== currentPlayer.playerId
      );


  if (result.qualifyingStarted && others.length) {

    html += '<h2>Other Predictions</h2>';

    others.forEach(function(playerId) {

      const player =
        grouped[playerId];

      html +=
        '<h3>' +
        escapeHtml(player.name) +
        '</h3>';

      html +=
        renderReadOnlyPredictions(
          player.predictions
        );

    });

  }

  area.innerHTML = html;

}


/* =========================================================
   PREDICTION EDITOR
   ========================================================= */

function renderPredictionEditor(
  predictions,
  locked
) {

  const existing = {};

  predictions.forEach(function(p) {
    existing[p.driverId] = p;
  });

  let html = '';

  html += '<div id="editor">';

  html +=
    '<div class="driver-row">' +
      '<div></div>' +
      '<div><span class="position-label">QUALIFYING</span></div>' +
      '<div><span class="position-label">RACE</span></div>' +
    '</div>';


  drivers.forEach(function(driver) {

    const prediction =
      existing[driver.driverId];

    const q =
      prediction
        ? prediction.qualifyingPosition
        : '';

    const r =
      prediction
        ? prediction.racePosition
        : '';

    html +=
      '<div class="driver-row">' +

        '<div class="driver-name">' +
          escapeHtml(driver.driver) +
          '<span class="team">' +
            escapeHtml(driver.team) +
          '</span>' +
        '</div>' +

        '<select class="q-position"' +
          (locked ? ' disabled' : '') +
          ' data-driver="' +
          driver.driverId +
        '">' +
          positionOptions(q) +
        '</select>' +

        '<select class="r-position"' +
          (locked ? ' disabled' : '') +
          ' data-driver="' +
          driver.driverId +
        '">' +
          positionOptions(r) +
        '</select>' +

      '</div>';

  });


  if (!locked) {

    html +=
      '<div class="save-container">' +

        '<button onclick="savePredictions()">' +
          '💾 Save Predictions' +
        '</button>' +

      '</div>';

  } else {

    html +=
      '<div class="message">' +
      'Predictions are locked because qualifying has started.' +
      '</div>';

  }

  html += '</div>';

  return html;

}


/* =========================================================
   POSITION OPTIONS
   ========================================================= */

function positionOptions(selected) {

  let html =
    '<option value="">—</option>';

  for (
    let i = 1;
    i <= drivers.length;
    i++
  ) {

    html +=
      '<option value="' +
      i +
      '"' +
      (
        Number(selected) === i
          ? ' selected'
          : ''
      ) +
      '>' +
      'P' +
      i +
      '</option>';

  }

  return html;

}


/* =========================================================
   SAVE
   ========================================================= */

function savePredictions() {

  /*
   * Saving will be enabled once the authentication
   * connection has been confirmed.
   */

  showAppMessage(
    'Authentication is working. Saving will be enabled in the next step.',
    false
  );

}


/* =========================================================
   OTHER PLAYERS
   ========================================================= */

function renderReadOnlyPredictions(predictions) {

  const sorted =
    predictions
      .slice()
      .sort(
        (a, b) =>
          a.racePosition -
          b.racePosition
      );

  let html =
    '<ol class="prediction-list">';

  sorted.forEach(function(p) {

    const driver =
      drivers.find(
        d =>
          d.driverId ===
          p.driverId
      );

    if (!driver) return;

    html +=
      '<li>' +
      escapeHtml(driver.driver) +
      ' — P' +
      p.racePosition +
      '</li>';

  });

  html += '</ol>';

  return html;

}


/* =========================================================
   API
   ========================================================= */

function apiCall(
  action,
  params,
  callback
) {

  const callbackName =
    'f1Callback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );

  const script =
    document.createElement('script');

  window[callbackName] =
    function(result) {

      delete window[callbackName];

      script.remove();

      callback(result);

    };


  const query =
    new URLSearchParams();

  query.set(
    'action',
    action
  );

  query.set(
    'callback',
    callbackName
  );


  if (session) {

    query.set(
      'session',
      session
    );

  }


  Object.keys(
    params || {}
  ).forEach(function(key) {

    query.set(
      key,
      params[key]
    );

  });


  script.src =
    API_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      callback({
        success: false,
        error:
          'Unable to contact the F1 Predictions server.'
      });

    };


  document.body.appendChild(script);

}


/* =========================================================
   MESSAGES
   ========================================================= */

function showLoginMessage(
  message,
  error
) {

  const el =
    document.getElementById(
      'loginMessage'
    );

  el.className =
    'message ' +
    (error ? 'error' : '');

  el.textContent =
    message;

}


function showAppMessage(
  message,
  error
) {

  const el =
    document.getElementById(
      'appMessage'
    );

  el.className =
    'message ' +
    (error ? 'error' : 'success');

  el.textContent =
    message;

}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}

</script>

</body>
</html>
