<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>F1 Predictions 2027</title>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f2f2f2;

      color: #151515;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      background: #111;

      color: white;

      padding: 18px 24px;

    }


    .header-inner {

      max-width: 1100px;

      margin: auto;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .logo {

      font-size: 21px;

      font-weight: 800;

      letter-spacing: -.3px;

    }


    /* =====================================================
       LAYOUT
       ===================================================== */

    .container {

      max-width: 1100px;

      margin: 35px auto;

      padding: 0 20px;

    }


    .card {

      background: white;

      border-radius: 16px;

      padding: 30px;

      box-shadow:
        0 4px 20px rgba(0,0,0,.07);

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    #login {

      max-width: 500px;

      margin: 80px auto;

      text-align: center;

    }


    #app {

      display: none;

    }


    .race-car {

      font-size: 58px;

      margin-bottom: 10px;

    }


    .login-title {

      font-size: 34px;

      font-weight: 800;

      margin: 0;

    }


    .subtitle {

      color: #666;

      margin:
        10px 0 30px;

      font-size: 16px;

    }


    #googleButton {

      display: flex;

      justify-content: center;

    }


    /* =====================================================
       TOP BAR
       ===================================================== */

    .topbar {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      flex-wrap: wrap;

      margin-bottom: 25px;

    }


    .welcome {

      font-size: 17px;

    }


    .welcome strong {

      font-weight: 800;

    }


    .race-selector {

      display: flex;

      align-items: center;

      gap: 10px;

    }


    select {

      padding:
        11px 14px;

      border:
        1px solid #ccc;

      border-radius: 9px;

      background: white;

      font-size: 15px;

    }


    /* =====================================================
       RACE INFORMATION
       ===================================================== */

    .race-info {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

      gap: 12px;

      margin-bottom: 25px;

    }


    .info-box {

      background: #f6f6f6;

      border-radius: 10px;

      padding: 14px 16px;

    }


    .info-label {

      display: block;

      font-size: 12px;

      color: #777;

      text-transform: uppercase;

      font-weight: 700;

      margin-bottom: 4px;

    }


    .info-value {

      font-weight: 700;

    }


    /* =====================================================
       LOCK / NOTICE
       ===================================================== */

    .notice {

      padding: 15px 17px;

      border-radius: 10px;

      margin-bottom: 25px;

      line-height: 1.5;

    }


    .notice.private {

      background: #fff6d7;

      border-left:
        4px solid #d3a500;

    }


    .notice.unlocked {

      background: #e8f7eb;

      border-left:
        4px solid #299447;

    }


    .notice.locked {

      background: #eee;

      border-left:
        4px solid #777;

    }


    /* =====================================================
       PREDICTION TABS
       ===================================================== */

    .prediction-tabs {

      display: flex;

      gap: 8px;

      margin-bottom: 20px;

      border-bottom:
        1px solid #ddd;

      padding-bottom: 8px;

    }


    .tab {

      background: transparent;

      color: #555;

      border: none;

      padding:
        10px 18px;

      border-radius: 8px;

      font-weight: 700;

      cursor: pointer;

    }


    .tab.active {

      background: #111;

      color: white;

    }


    .prediction-panel {

      display: none;

    }


    .prediction-panel.active {

      display: block;

    }


    /* =====================================================
       PREDICTION HEADER
       ===================================================== */

    .prediction-heading {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 12px;

    }


    .prediction-heading h2 {

      margin: 0;

      font-size: 23px;

    }


    .drag-hint {

      color: #777;

      font-size: 13px;

    }


    /* =====================================================
       DRIVER LIST
       ===================================================== */

    .prediction-list {

      display: flex;

      flex-direction: column;

      gap: 7px;

      min-height: 100px;

    }


    .driver-card {

      display: grid;

      grid-template-columns:
        48px 1fr auto;

      align-items: center;

      gap: 12px;

      padding:
        9px 12px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      background: white;

      cursor: grab;

      user-select: none;

      transition:
        transform .12s,
        box-shadow .12s,
        opacity .12s;

    }


    .driver-card:hover {

      box-shadow:
        0 3px 10px rgba(0,0,0,.08);

    }


    .driver-card.dragging {

      opacity: .45;

      transform:
        scale(.98);

    }


    .driver-card.drag-over {

      border:
        2px solid #111;

      transform:
        translateY(2px);

    }


    .position {

      width: 40px;

      height: 40px;

      display: flex;

      justify-content: center;

      align-items: center;

      border-radius: 8px;

      background: #111;

      color: white;

      font-weight: 800;

      font-size: 15px;

    }


    .driver-details {

      min-width: 0;

    }


    .driver-name {

      font-weight: 800;

      font-size: 15px;

    }


    .driver-team {

      color: #777;

      font-size: 12px;

      margin-top: 2px;

    }


    .drag-handle {

      color: #999;

      font-size: 20px;

      padding:
        5px;

    }


    /* =====================================================
       MOBILE MOVE BUTTONS
       ===================================================== */

    .move-buttons {

      display: flex;

      gap: 4px;

    }


    .move-button {

      width: 30px;

      height: 30px;

      padding: 0;

      border: 1px solid #ddd;

      background: #f7f7f7;

      color: #333;

      border-radius: 6px;

      font-size: 15px;

      cursor: pointer;

    }


    .move-button:hover {

      background: #e8e8e8;

    }


    /* =====================================================
       SAVE
       ===================================================== */

    .save-section {

      margin-top: 25px;

      display: flex;

      align-items: center;

      gap: 15px;

      flex-wrap: wrap;

    }


    .save-button {

      background: #111;

      color: white;

      border: none;

      padding:
        13px 24px;

      border-radius: 9px;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

    }


    .save-button:hover {

      opacity: .85;

    }


    .save-button:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    /* =====================================================
       OTHER PLAYERS
       ===================================================== */

    .other-players {

      margin-top: 40px;

      border-top:
        1px solid #ddd;

      padding-top: 25px;

    }


    .player-section {

      margin-top: 25px;

    }


    .player-section h3 {

      margin-bottom: 10px;

    }


    .readonly-list {

      display: flex;

      flex-direction: column;

      gap: 5px;

    }


    .readonly-row {

      display: grid;

      grid-template-columns:
        40px 1fr;

      align-items: center;

      gap: 10px;

      padding:
        7px 10px;

      background: #f6f6f6;

      border-radius: 7px;

    }


    .readonly-position {

      font-weight: 800;

    }


    /* =====================================================
       MESSAGES
       ===================================================== */

    .message {

      padding:
        13px 16px;

      border-radius: 9px;

      margin-top: 15px;

    }


    .error {

      background: #ffe4e4;

      color: #990000;

    }


    .success {

      background: #e6f7e9;

      color: #176b26;

    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 650px) {

      .container {

        margin-top: 15px;

        padding:
          0 10px;

      }


      .card {

        padding: 18px;

        border-radius: 12px;

      }


      .header {

        padding:
          15px;

      }


      .logo {

        font-size: 18px;

      }


      .topbar {

        align-items: stretch;

      }


      .race-selector {

        width: 100%;

      }


      .race-selector select {

        flex: 1;

      }


      .prediction-heading {

        display: block;

      }


      .drag-hint {

        display: block;

        margin-top: 5px;

      }


      .driver-card {

        grid-template-columns:
          42px 1fr auto;

        gap: 9px;

        padding:
          8px;

      }


      .position {

        width: 36px;

        height: 36px;

      }


      .drag-handle {

        display: none;

      }


      .move-button {

        width: 32px;

        height: 32px;

      }

    }

  </style>

</head>


<body>


<!-- =======================================================
     HEADER
     ======================================================= -->

<header class="header">

  <div class="header-inner">

    <div class="logo">
      🏁 F1 Predictions 2027
    </div>

  </div>

</header>


<div class="container">


  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <div
    class="card"
    id="login"
  >

    <div class="race-car">
      🏎️
    </div>

    <h1 class="login-title">
      F1 Predictions 2027
    </h1>

    <div class="subtitle">
      Make your predictions. Beat your mates.
    </div>

    <div id="googleButton"></div>

    <div id="loginMessage"></div>

  </div>


  <!-- =====================================================
       APP
       ===================================================== -->

  <div
    class="card"
    id="app"
  >

    <div class="topbar">

      <div class="welcome">

        Welcome back,
        <strong id="playerName"></strong>

      </div>


      <div class="race-selector">

        <label for="raceSelect">
          <strong>Race:</strong>
        </label>

        <select id="raceSelect"></select>

      </div>

    </div>


    <div
      class="race-info"
      id="raceInfo"
    ></div>


    <div
      id="predictionNotice"
    ></div>


    <!-- ===================================================
         TABS
         =================================================== -->

    <div class="prediction-tabs">

      <button
        class="tab active"
        id="qualifyingTab"
        onclick="switchTab('qualifying')"
      >
        🕐 Qualifying
      </button>


      <button
        class="tab"
        id="raceTab"
        onclick="switchTab('race')"
      >
        🏁 Race
      </button>

    </div>


    <!-- ===================================================
         QUALIFYING
         =================================================== -->

    <div
      class="prediction-panel active"
      id="qualifyingPanel"
    >

      <div class="prediction-heading">

        <h2>
          Qualifying Prediction
        </h2>

        <span class="drag-hint">
          Drag drivers into your predicted order
        </span>

      </div>


      <div
        class="prediction-list"
        id="qualifyingList"
      ></div>

    </div>


    <!-- ===================================================
         RACE
         =================================================== -->

    <div
      class="prediction-panel"
      id="racePanel"
    >

      <div class="prediction-heading">

        <h2>
          Race Prediction
        </h2>

        <span class="drag-hint">
          Drag drivers into your predicted order
        </span>

      </div>


      <div
        class="prediction-list"
        id="raceList"
      ></div>

    </div>


    <!-- ===================================================
         SAVE
         =================================================== -->

    <div
      class="save-section"
      id="saveSection"
    >

      <button
        class="save-button"
        id="saveButton"
        onclick="savePredictions()"
      >
        💾 Save Predictions
      </button>

      <span
        id="saveStatus"
      ></span>

    </div>


    <div id="appMessage"></div>


    <!-- ===================================================
         OTHER PLAYERS
         =================================================== -->

    <div
      class="other-players"
      id="otherPlayers"
    ></div>

  </div>

</div>


<script>


/* =========================================================
   CONFIG
   ========================================================= */

const CLIENT_ID =
  '618343895277-klbvf987p9vqvr8tf72si0ht79v1cpj8.apps.googleusercontent.com';


const API_URL =
  'https://script.google.com/macros/s/AKfycbxioW-0oLb8U-yGFvV5iVNYVClr7W5NJl0ofQ-NoXdOxxQdgUAs4_w4Ei_0rbCuN70IfA/exec';


/* =========================================================
   STATE
   ========================================================= */

let session = null;

let currentPlayer = null;

let races = [];

let drivers = [];

let selectedRace = null;

let qualifyingOrder = [];

let raceOrder = [];

let draggedElement = null;


/* =========================================================
   GOOGLE LOGIN
   ========================================================= */

window.onload = function() {

  google.accounts.id.initialize({

    client_id:
      CLIENT_ID,

    callback:
      handleGoogleCredential

  });


  google.accounts.id.renderButton(

    document.getElementById(
      'googleButton'
    ),

    {

      theme:
        'outline',

      size:
        'large',

      text:
        'continue_with',

      shape:
        'rectangular',

      width:
        280

    }

  );

};


/* =========================================================
   HANDLE GOOGLE CREDENTIAL
   ========================================================= */

function handleGoogleCredential(
  response
) {

  showLoginMessage(
    'Signing you in...'
  );


  apiCall(

    'login',

    {

      credential:
        response.credential

    },

    function(result) {

      if (!result.success) {

        showLoginMessage(

          result.error ||
          'Unable to sign you in.',

          true

        );

        return;

      }


      session =
        result.session;


      currentPlayer =
        result.player;


      localStorage.setItem(

        'f1_session',

        session

      );


      enterApp();

    }

  );

}


/* =========================================================
   ENTER APP
   ========================================================= */

function enterApp() {

  document.getElementById(
    'login'
  ).style.display =
    'none';


  document.getElementById(
    'app'
  ).style.display =
    'block';


  document.getElementById(
    'playerName'
  ).textContent =
    currentPlayer.name;


  loadRaces();

}


/* =========================================================
   LOAD RACES
   ========================================================= */

function loadRaces() {

  apiCall(

    'races',

    {},

    function(result) {

      if (!result.success) {

        showAppMessage(
          result.error,
          true
        );

        return;

      }


      races =
        result.races;


      const select =
        document.getElementById(
          'raceSelect'
        );


      select.innerHTML =
        '';


      races.forEach(
        function(race) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            race.raceId;


          option.textContent =
            race.race;


          select.appendChild(
            option
          );

        }
      );


      select.onchange =
        loadRace;


      loadDrivers();

    }

  );

}


/* =========================================================
   LOAD DRIVERS
   ========================================================= */

function loadDrivers() {

  apiCall(

    'drivers',

    {},

    function(result) {

      if (!result.success) {

        showAppMessage(
          result.error,
          true
        );

        return;

      }


      drivers =
        result.drivers;


      loadRace();

    }

  );

}


/* =========================================================
   LOAD RACE
   ========================================================= */

function loadRace() {

  const raceId =
    document.getElementById(
      'raceSelect'
    ).value;


  if (!raceId) {
    return;
  }


  selectedRace =
    races.find(
      r =>
        r.raceId === raceId
    );


  renderRaceInfo();


  apiCall(

    'predictions',

    {

      raceId:
        raceId

    },

    function(result) {

      if (!result.success) {

        showAppMessage(
          result.error,
          true
        );

        return;

      }


      buildOrders(
        result.predictions
      );


      renderPredictionInterface(
        result
      );


      renderOtherPlayers(
        result
      );

    }

  );

}


/* =========================================================
   RACE INFO
   ========================================================= */

function renderRaceInfo() {

  if (!selectedRace) {
    return;
  }


  let html = '';


  if (
    selectedRace.qualifyingStart
  ) {

    html +=
      '<div class="info-box">' +

        '<span class="info-label">' +
          'Qualifying' +
        '</span>' +

        '<span class="info-value">' +
          formatDate(
            selectedRace.qualifyingStart
          ) +
        '</span>' +

      '</div>';

  }


  if (
    selectedRace.raceStart
  ) {

    html +=
      '<div class="info-box">' +

        '<span class="info-label">' +
          'Race' +
        '</span>' +

        '<span class="info-value">' +
          formatDate(
            selectedRace.raceStart
          ) +
        '</span>' +

      '</div>';

  }


  if (
    selectedRace.sprint
  ) {

    html +=
      '<div class="info-box">' +

        '<span class="info-label">' +
          'Weekend' +
        '</span>' +

        '<span class="info-value">' +
          'Sprint weekend' +
        '</span>' +

      '</div>';

  }


  document.getElementById(
    'raceInfo'
  ).innerHTML =
    html;

}


/* =========================================================
   BUILD DRIVER ORDERS
   ========================================================= */

function buildOrders(
  predictions
) {

  const myPredictions =
    predictions.filter(
      p =>
        p.playerId ===
        currentPlayer.playerId
    );


  /*
   * If we have saved predictions,
   * reconstruct the order from them.
   */

  if (
    myPredictions.length ===
    drivers.length
  ) {

    qualifyingOrder =
      myPredictions
        .slice()
        .sort(
          (a, b) =>
            a.qualifyingPosition -
            b.qualifyingPosition
        )
        .map(
          p =>
            p.driverId
        );


    raceOrder =
      myPredictions
        .slice()
        .sort(
          (a, b) =>
            a.racePosition -
            b.racePosition
        )
        .map(
          p =>
            p.driverId
        );

  } else {

    /*
     * No saved predictions yet.
     * Start with the drivers in their
     * Drivers sheet order.
     */

    qualifyingOrder =
      drivers.map(
        d =>
          d.driverId
      );


    raceOrder =
      drivers.map(
        d =>
          d.driverId
      );

  }

}


/* =========================================================
   RENDER PREDICTION INTERFACE
   ========================================================= */

function renderPredictionInterface(
  result
) {

  const locked =
    result.qualifyingStarted;


  if (locked) {

    document.getElementById(
      'predictionNotice'
    ).innerHTML =

      '<div class="notice locked">' +

        '<strong>🔒 Predictions locked</strong><br>' +

        'Qualifying has started, so predictions can no longer be changed.' +

      '</div>';

  } else {

    document.getElementById(
      'predictionNotice'
    ).innerHTML =

      '<div class="notice private">' +

        '<strong>🔒 Your predictions are private</strong><br>' +

        'Other players cannot see them until qualifying starts.' +

      '</div>';

  }


  renderList(
    'qualifyingList',
    qualifyingOrder,
    locked
  );


  renderList(
    'raceList',
    raceOrder,
    locked
  );


  document.getElementById(
    'saveSection'
  ).style.display =
    locked
      ? 'none'
      : 'flex';

}


/* =========================================================
   RENDER DRIVER LIST
   ========================================================= */

function renderList(
  elementId,
  order,
  locked
) {

  const container =
    document.getElementById(
      elementId
    );


  container.innerHTML =
    '';


  order.forEach(
    function(driverId, index) {

      const driver =
        drivers.find(
          d =>
            d.driverId ===
            driverId
        );


      if (!driver) {
        return;
      }


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'driver-card';


      card.draggable =
        !locked;


      card.dataset.driverId =
        driver.driverId;


      card.dataset.index =
        index;


      card.innerHTML =

        '<div class="position">' +

          'P' +
          (index + 1) +

        '</div>' +


        '<div class="driver-details">' +

          '<div class="driver-name">' +

            escapeHtml(
              driver.driver
            ) +

          '</div>' +

          '<div class="driver-team">' +

            escapeHtml(
              driver.team
            ) +

          '</div>' +

        '</div>' +


        (
          locked

          ?

          '<div></div>'

          :

          '<div class="move-buttons">' +

            '<button' +

              ' class="move-button"' +

              ' onclick="moveDriver(' +

                "'" +
                elementId +
                "'," +
                index +
                ",-1" +

              '); event.stopPropagation();"' +

              (
                index === 0
                  ? ' disabled'
                  : ''
              ) +

            '>' +

              '↑' +

            '</button>' +


            '<button' +

              ' class="move-button"' +

              ' onclick="moveDriver(' +

                "'" +
                elementId +
                "'," +
                index +
                ",1" +

              '); event.stopPropagation();"' +

              (
                index ===
                order.length - 1
                  ? ' disabled'
                  : ''
              ) +

            '>' +

              '↓' +

            '</button>' +

          '</div>'

        );


      if (!locked) {

        addDragEvents(
          card,
          elementId
        );

      }


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   DRAG EVENTS
   ========================================================= */

function addDragEvents(
  card,
  listId
) {

  card.addEventListener(
    'dragstart',
    function(e) {

      draggedElement =
        card;

      card.classList.add(
        'dragging'
      );


      e.dataTransfer.effectAllowed =
        'move';


      e.dataTransfer.setData(
        'text/plain',
        card.dataset.driverId
      );

    }
  );


  card.addEventListener(
    'dragend',
    function() {

      card.classList.remove(
        'dragging'
      );


      document
        .querySelectorAll(
          '.driver-card'
        )
        .forEach(
          el =>
            el.classList.remove(
              'drag-over'
            )
        );

    }
  );


  card.addEventListener(
    'dragover',
    function(e) {

      e.preventDefault();


      if (
        card ===
        draggedElement
      ) {
        return;
      }


      card.classList.add(
        'drag-over'
      );

    }
  );


  card.addEventListener(
    'dragleave',
    function() {

      card.classList.remove(
        'drag-over'
      );

    }
  );


  card.addEventListener(
    'drop',
    function(e) {

      e.preventDefault();


      card.classList.remove(
        'drag-over'
      );


      if (
        !draggedElement ||
        draggedElement === card
      ) {
        return;
      }


      const container =
        document.getElementById(
          listId
        );


      const cards =
        Array.from(
          container.children
        );


      const fromIndex =
        cards.indexOf(
          draggedElement
        );


      const toIndex =
        cards.indexOf(
          card
        );


      if (
        fromIndex <
        toIndex
      ) {

        container.insertBefore(
          draggedElement,
          card.nextSibling
        );

      } else {

        container.insertBefore(
          draggedElement,
          card
        );

      }


      updateOrderFromDOM(
        listId
      );

    }
  );

}


/* =========================================================
   UPDATE ORDER
   ========================================================= */

function updateOrderFromDOM(
  listId
) {

  const container =
    document.getElementById(
      listId
    );


  const newOrder =
    Array.from(
      container.children
    )
    .map(
      card =>
        card.dataset.driverId
    );


  if (
    listId ===
    'qualifyingList'
  ) {

    qualifyingOrder =
      newOrder;

  } else {

    raceOrder =
      newOrder;

  }


  refreshPositions(
    listId
  );

}


/* =========================================================
   REFRESH POSITION NUMBERS
   ========================================================= */

function refreshPositions(
  listId
) {

  const container =
    document.getElementById(
      listId
    );


  Array.from(
    container.children
  ).forEach(
    function(card, index) {

      const position =
        card.querySelector(
          '.position'
        );


      if (position) {

        position.textContent =
          'P' +
          (index + 1);

      }

    }
  );

}


/* =========================================================
   MOVE DRIVER
   ========================================================= */

function moveDriver(
  listId,
  index,
  direction
) {

  const order =
    listId ===
      'qualifyingList'
      ? qualifyingOrder
      : raceOrder;


  const newIndex =
    index + direction;


  if (
    newIndex < 0 ||
    newIndex >= order.length
  ) {
    return;
  }


  const temp =
    order[index];


  order[index] =
    order[newIndex];


  order[newIndex] =
    temp;


  renderList(
    listId,
    order,
    false
  );

}


/* =========================================================
   TABS
   ========================================================= */

function switchTab(
  tab
) {

  const qualifyingTab =
    document.getElementById(
      'qualifyingTab'
    );


  const raceTab =
    document.getElementById(
      'raceTab'
    );


  const qualifyingPanel =
    document.getElementById(
      'qualifyingPanel'
    );


  const racePanel =
    document.getElementById(
      'racePanel'
    );


  if (
    tab ===
    'qualifying'
  ) {

    qualifyingTab.classList.add(
      'active'
    );


    raceTab.classList.remove(
      'active'
    );


    qualifyingPanel.classList.add(
      'active'
    );


    racePanel.classList.remove(
      'active'
    );

  } else {

    raceTab.classList.add(
      'active'
    );


    qualifyingTab.classList.remove(
      'active'
    );


    racePanel.classList.add(
      'active'
    );


    qualifyingPanel.classList.remove(
      'active'
    );

  }

}


/* =========================================================
   SAVE PREDICTIONS
   ========================================================= */

function savePredictions() {

  if (!selectedRace) {

    showAppMessage(
      'Please select a race.',
      true
    );

    return;

  }


  if (
    qualifyingOrder.length !==
    drivers.length ||
    raceOrder.length !==
    drivers.length
  ) {

    showAppMessage(
      'Please rank every driver.',
      true
    );

    return;

  }


  const predictionRows = [];


  /*
   * Build a lookup for the race positions.
   */

  const racePositions = {};


  raceOrder.forEach(
    function(driverId, index) {

      racePositions[
        driverId
      ] =
        index + 1;

    }
  );


  /*
   * Combine qualifying and race
   * positions for each driver.
   */

  qualifyingOrder.forEach(
    function(driverId, index) {

      predictionRows.push({

        driverId:
          driverId,

        qualifyingPosition:
          index + 1,

        racePosition:
          racePositions[
            driverId
          ]

      });

    }
  );


  const saveButton =
    document.getElementById(
      'saveButton'
    );


  saveButton.disabled =
    true;


  document.getElementById(
    'saveStatus'
  ).textContent =
    'Saving...';


  apiCall(

    'savePredictions',

    {

      raceId:
        selectedRace.raceId,

      predictions:
        JSON.stringify(
          predictionRows
        )

    },

    function(result) {

      saveButton.disabled =
        false;


      if (!result.success) {

        document.getElementById(
          'saveStatus'
        ).textContent =
          '';


        showAppMessage(
          result.error ||
          'Unable to save predictions.',
          true
        );

        return;

      }


      document.getElementById(
        'saveStatus'
      ).textContent =
        '✓ Saved';


      showAppMessage(
        'Predictions saved successfully.',
        false
      );


      /*
       * Reload from the server to confirm
       * the saved values.
       */

      setTimeout(
        function() {

          loadRace();

        },
        500
      );

    }

  );

}


/* =========================================================
   OTHER PLAYERS
   ========================================================= */

function renderOtherPlayers(
  result
) {

  const container =
    document.getElementById(
      'otherPlayers'
    );


  container.innerHTML =
    '';


  if (
    !result.qualifyingStarted
  ) {

    return;

  }


  const grouped = {};


  result.predictions.forEach(
    function(prediction) {

      if (
        prediction.playerId ===
        currentPlayer.playerId
      ) {

        return;

      }


      if (
        !grouped[
          prediction.playerId
        ]
      ) {

        grouped[
          prediction.playerId
        ] = {

          name:
            prediction.playerName,

          predictions: []

        };

      }


      grouped[
        prediction.playerId
      ]
      .predictions
      .push(
        prediction
      );

    }
  );


  const playerIds =
    Object.keys(
      grouped
    );


  if (
    playerIds.length === 0
  ) {

    return;

  }


  let html =
    '<h2>Other Predictions</h2>';


  playerIds.forEach(
    function(playerId) {

      const player =
        grouped[
          playerId
        ];


      const sorted =
        player.predictions
          .slice()
          .sort(
            (a, b) =>
              a.racePosition -
              b.racePosition
          );


      html +=

        '<div class="player-section">' +

          '<h3>' +

            escapeHtml(
              player.name
            ) +

          '</h3>' +


          '<div class="readonly-list">';


      sorted.forEach(
        function(prediction) {

          const driver =
            drivers.find(
              d =>
                d.driverId ===
                prediction.driverId
            );


          if (!driver) {
            return;
          }


          html +=

            '<div class="readonly-row">' +

              '<div class="readonly-position">' +

                'P' +
                prediction.racePosition +

              '</div>' +

              '<div>' +

                '<strong>' +

                  escapeHtml(
                    driver.driver
                  ) +

                '</strong>' +

                '<br>' +

                '<small>' +

                  escapeHtml(
                    driver.team
                  ) +

                '</small>' +

              '</div>' +

            '</div>';

        }
      );


      html +=

          '</div>' +

        '</div>';

    }
  );


  container.innerHTML =
    html;

}


/* =========================================================
   API CALL
   ========================================================= */

function apiCall(
  action,
  params,
  callback
) {

  const callbackName =
    'f1Callback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      'script'
    );


  window[
    callbackName
  ] =
    function(result) {

      delete window[
        callbackName
      ];


      script.remove();


      callback(
        result
      );

    };


  const query =
    new URLSearchParams();


  query.set(
    'action',
    action
  );


  query.set(
    'callback',
    callbackName
  );


  if (session) {

    query.set(
      'session',
      session
    );

  }


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      query.set(
        key,
        params[key]
      );

    }
  );


  script.src =
    API_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      script.remove();


      callback({

        success:
          false,

        error:
          'Unable to contact the F1 Predictions server.'

      });

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   LOGIN MESSAGE
   ========================================================= */

function showLoginMessage(
  message,
  error
) {

  const element =
    document.getElementById(
      'loginMessage'
    );


  element.className =
    'message ' +
    (
      error
        ? 'error'
        : ''
    );


  element.textContent =
    message;

}


/* =========================================================
   APP MESSAGE
   ========================================================= */

function showAppMessage(
  message,
  error
) {

  const element =
    document.getElementById(
      'appMessage'
    );


  element.className =
    'message ' +
    (
      error
        ? 'error'
        : 'success'
    );


  element.textContent =
    message;

}


/* =========================================================
   DATE FORMAT
   ========================================================= */

function formatDate(
  value
) {

  if (!value) {
    return 'TBC';
  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleString(
    [],
    {
      weekday:
        'short',

      day:
        'numeric',

      month:
        'short',

      hour:
        '2-digit',

      minute:
        '2-digit'

    }
  );

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
